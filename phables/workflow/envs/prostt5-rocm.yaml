name: prostt5-rocm
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - pip
  - pip:
    # Unlike CUDA, ROCm is never the default pip torch build -- this index
    # override is required, not just for reproducibility. rocm6.3 was the
    # newest version confirmed to have a torch wheel when this file was
    # written; check https://download.pytorch.org/whl/torch/ for the current
    # list and match it to the target machine's ROCm driver version (e.g.
    # Setonix's MI250X nodes -- confirm the installed ROCm version there
    # before assuming this one is right; it was not verified against any
    # actual ROCm hardware while writing this).
    - --extra-index-url https://download.pytorch.org/whl/rocm6.3
    - pholdlib>=0.1.2
